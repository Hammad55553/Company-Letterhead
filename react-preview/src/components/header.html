<style>
  :root {
    --primary-color: #052950;
    --accent-color: #11b6aa;
    --grey-color: #cbd5e1;
    --text-color: #2b3340;
    --muted-color: #6b7686;
    --font-display: 'Sora', 'Segoe UI', Arial, sans-serif;
    --font-body: 'Instrument Sans', 'Segoe UI', Arial, sans-serif;
    --font-mono: 'Martian Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace;
  }

  /* ---------------- HEADER CORNER SHAPE (hex mesh, top-right only) ---------------- */
  .top-tech {
    position: absolute;
    top: 0;
    right: 0;
    width: 320px;
    height: 190px;
    pointer-events: none;
    z-index: 5;
    overflow: hidden;
  }
  .top-tech .h-navy { fill: var(--primary-color); }
  .top-tech .h-teal { fill: var(--accent-color); }
  .top-tech .h-line { fill: none; stroke: var(--accent-color); stroke-width: 1.3; }
  .top-tech .h-grey { fill: none; stroke: var(--grey-color); stroke-width: 1.3; }
  .top-tech .h-dot  { fill: var(--accent-color); }

  /* ---------------- HEADER ---------------- */
  .header {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 56px 60px 20px 60px;
    padding-right: 300px;
    position: relative;
    z-index: 10;
  }

  /* Short gradient line at top left */
  .header::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 2in;
    height: 4px;
    background: linear-gradient(90deg, var(--primary-color) 0%, var(--accent-color) 100%);
  }

  .main-logo {
    height: 66px;
    object-fit: contain;
  }

  .company-name {
    font-family: var(--font-display);
    font-size: 23px;
    font-weight: 800;
    color: var(--primary-color);
    letter-spacing: -0.3px;
    margin: 0;
    line-height: 1.1;
  }

  .company-tagline {
    font-family: var(--font-mono);
    font-size: 9px;
    font-weight: 400;
    color: var(--accent-color);
    letter-spacing: 0.4px;
    margin: 6px 0 0 0;
  }
</style>

<!-- Top Right Corner: Hex Mesh -->

  <defs>
    <polygon id="hex" points="0,-18 15.6,-9 15.6,9 0,18 -15.6,9 -15.6,-9"/>
  </defs>
  <use href="#hex" x="320" y="0" class="h-navy"/>
  <use href="#hex" x="285.4" y="0" class="h-navy"/>
  <use href="#hex" x="250.7" y="0" class="h-navy"/>
  <use href="#hex" x="216.1" y="0" class="h-teal"/>
  <use href="#hex" x="181.4" y="0" class="h-line" opacity="0.85"/>
  <use href="#hex" x="146.8" y="0" class="h-grey" opacity="0.6"/>
  <use href="#hex" x="112.1" y="0" class="h-grey" opacity="0.35"/>
  <use href="#hex" x="302.7" y="30" class="h-navy"/>
  <use href="#hex" x="268" y="30" class="h-navy"/>
  <use href="#hex" x="233.4" y="30" class="h-line" opacity="0.9"/>
  <use href="#hex" x="198.7" y="30" class="h-teal" opacity="0.75"/>
  <use href="#hex" x="164.1" y="30" class="h-grey" opacity="0.5"/>
  <use href="#hex" x="129.4" y="30" class="h-grey" opacity="0.3"/>
  <use href="#hex" x="320" y="60" class="h-navy"/>
  <use href="#hex" x="285.4" y="60" class="h-teal"/>
  <use href="#hex" x="250.7" y="60" class="h-line" opacity="0.7"/>
  <use href="#hex" x="216.1" y="60" class="h-grey" opacity="0.55"/>
  <use href="#hex" x="181.4" y="60" class="h-grey" opacity="0.35"/>
  <use href="#hex" x="146.8" y="60" class="h-teal" opacity="0.18"/>
  <use href="#hex" x="302.7" y="90" class="h-line" opacity="0.8"/>
  <use href="#hex" x="268" y="90" class="h-grey" opacity="0.55"/>
  <use href="#hex" x="233.4" y="90" class="h-teal" opacity="0.45"/>
  <use href="#hex" x="198.7" y="90" class="h-grey" opacity="0.3"/>
  <use href="#hex" x="320" y="120" class="h-grey" opacity="0.5"/>
  <use href="#hex" x="285.4" y="120" class="h-grey" opacity="0.4"/>

  <use href="#hex" x="302.7" y="150" class="h-grey" opacity="0.3"/>
  <use href="#hex" x="268" y="150" class="h-teal" opacity="0.25"/>

</svg>

<!-- Header -->
<header class="header">
  <img src="assets/unnamed-removebg-preview.png" class="main-logo" alt="Asper InfoTech Logo" />
  <div class="company-info">
    <h1 class="company-name">Asper InfoTech</h1>
    <p class="company-tagline">(Private) Limited</p>
  </div>
</header>
