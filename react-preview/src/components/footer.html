<style>
  :root {
    --primary-color: #052950;
    --accent-color: #11b6aa;
    --grey-color: #cbd5e1;
    --text-color: #2b3340;
    --muted-color: #6b7686;
    --font-display: 'Sora', 'Segoe UI', Arial, sans-serif;
    --font-body: 'Instrument Sans', 'Segoe UI', Arial, sans-serif;
    --font-mono: 'Martian Mono', 'JetBrains Mono', Consolas, 'Courier New', monospace;
  }

  /* ---------------- FOOTER CORNER SHAPE (hex mesh, bottom-left) ---------------- */
  .bottom-tech {
    position: absolute;
    bottom: 90px; /* Sits completely above the footer block */
    left: 0;
    width: 320px;
    height: 190px;
    pointer-events: none;
    z-index: 5; 
    overflow: hidden;
    transform: rotate(180deg);
    opacity: 0.15; /* Subtle watermark on white background */
  }
  .bottom-tech .h-navy { fill: var(--primary-color); }
  .bottom-tech .h-teal { fill: var(--accent-color); }
  .bottom-tech .h-line { fill: none; stroke: var(--accent-color); stroke-width: 1.3; }
  .bottom-tech .h-grey { fill: none; stroke: var(--grey-color); stroke-width: 1.3; }
  .bottom-tech .h-dot  { fill: var(--accent-color); }

  /* ---------------- FOOTER (text only, no shapes) ---------------- */
  .footer {
    padding: 36px 60px 40px 60px; /* Increased top/bottom padding to make it taller */
    text-align: center;
    position: relative;
    z-index: 10;
    background-color: #f1f5f9; /* Subtle slate/grey background */
  }

  /* Gradient line above footer */
  .footer::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--primary-color) 0%, var(--accent-color) 100%);
  }

  /* Short gradient line at bottom right */
  .footer::after {
    content: '';
    position: absolute;
    bottom: 0;
    right: 0;
    width: 2in;
    height: 4px;
    background: linear-gradient(270deg, var(--primary-color) 0%, var(--accent-color) 100%);
  }
  .footer-text {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 500;
    display: flex;
    justify-content: center;
    gap: 25px;
    white-space: nowrap;
  }
</style>
