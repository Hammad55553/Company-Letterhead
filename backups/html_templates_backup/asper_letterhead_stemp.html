<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asper InfoTech Corporate Stamp</title>
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background-color: #f8f9fa;
    font-family: 'Arial', sans-serif;
    margin: 0;
  }

  .stamp-container {
    position: relative;
    width: 320px; /* Expanded for more room */
    height: 320px;
    border-radius: 50%;
    /* Outer and inner rings */
    border: 5px solid #1a1a1a;
    box-shadow: inset 0 0 0 2px #fff, inset 0 0 0 4px #1a1a1a;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #1a1a1a;
    background-color: transparent;
    
    /* Subtle rotation for realistic stamp placement */
    transform: rotate(-2deg);
    
    /* SVG Grunge filter to give realistic ink effect */
    filter: url(#grunge-ink) contrast(1.2) drop-shadow(0px 0px 1px rgba(0,0,0,0.2));
  }

  .curved-text-layer {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    pointer-events: none;
  }

  .inner-ring {
    position: absolute;
    width: 220px; /* Moved outward away from center */
    height: 220px;
    border-radius: 50%;
    border: 2px solid #1a1a1a;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }

  .center-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 10;
    margin-top: -10px;
  }

  .logo {
    width: 80px;
    height: auto;
    /* Since background is removed, we can safely force it to pure black */
    filter: grayscale(100%) contrast(200%) brightness(0);
    margin-bottom: 5px;
  }

  .ceo-title {
    font-family: 'Arial', sans-serif;
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 2px;
    margin-top: 5px;
  }

  .ceo-name {
    font-family: 'Arial', sans-serif;
    font-size: 18px;
    font-weight: bold;
    margin-top: 2px;
    letter-spacing: 0.5px;
  }

  .stars {
    position: absolute;
    width: 100%;
    top: 50%;
    left: 0;
    display: flex;
    justify-content: space-between;
    transform: translateY(-50%);
    box-sizing: border-box;
    padding: 0 18px; /* Adjusted to perfect optical center */
    font-size: 14px; /* Reduced so it doesn't touch lines */
    font-family: 'Courier New', monospace;
    font-weight: bold;
    color: #1a1a1a;
    line-height: 1;
  }

</style>
</head>
<body>

<!-- SVG Filter for Rubber Stamp Ink Effect -->
<svg style="position:absolute; width:0; height:0;" aria-hidden="true">
  <defs>
    <filter id="grunge-ink">
      <!-- Create noise -->
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="4" result="noise" />
      <!-- High contrast noise to create isolated specs -->
      <feComponentTransfer in="noise" result="highContrastNoise">
        <feFuncA type="linear" slope="3" intercept="-1" />
      </feComponentTransfer>
      <!-- Cut out noise from the stamp -->
      <feComposite operator="out" in="SourceGraphic" in2="highContrastNoise" result="distressed" />
      <!-- Slight blur for ink bleed -->
      <feGaussianBlur stdDeviation="0.3" in="distressed" result="blurred" />
      <!-- Sharpen the edges back up slightly -->
      <feComponentTransfer in="blurred" result="final">
        <feFuncA type="linear" slope="3" intercept="-0.1" />
      </feComponentTransfer>
    </filter>
  </defs>
</svg>

<div class="stamp-container">
  
  <svg class="curved-text-layer" viewBox="0 0 320 320">
    <!-- Top Arc: radius 121 (centers text in 320px container) -->
    <path id="topCurve" d="M 39,160 A 121,121 0 0,1 281,160" fill="none" />
    <text font-family="'Arial', sans-serif" font-size="28" font-weight="bold" fill="#1a1a1a" letter-spacing="3">
      <textPath href="#topCurve" startOffset="50%" text-anchor="middle">ASPER INFOTECH</textPath>
    </text>
    
    <!-- Bottom Arc: radius 148 (centers text in 320px container) -->
    <path id="bottomCurve" d="M 12,160 A 148,148 0 0,0 308,160" fill="none" />
    <text font-family="'Arial', sans-serif" font-size="24" font-weight="bold" fill="#1a1a1a" letter-spacing="4">
      <textPath href="#bottomCurve" startOffset="50%" text-anchor="middle">PRIVATE LIMITED</textPath>
    </text>
  </svg>

  <!-- Inner circle boundary line -->
  <div class="inner-ring"></div>

  <div class="stars">
    <span>&lt;/&gt;</span>
    <span>&lt;/&gt;</span>
  </div>
  
  <div class="center-content">
    <img src="unnamed-removebg-preview.png" class="logo" alt="Asper InfoTech Logo" />
    <div class="ceo-title">— CEO —</div>
    <div class="ceo-name">HAMMAD ASLAM</div>
  </div>

</div>

</body>
</html>
